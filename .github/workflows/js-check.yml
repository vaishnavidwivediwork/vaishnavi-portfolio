
name: JavaScript Syntax Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - premium-motion-upgrade

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check script.js
        
