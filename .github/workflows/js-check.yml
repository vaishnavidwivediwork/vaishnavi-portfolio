
name: JavaScript Syntax Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - premium-motion-upgrade

jobs:
  syntax-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check script.js
        
